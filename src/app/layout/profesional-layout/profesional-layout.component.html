
<div class="min-h-screen bg-slate-50/50">
  @if (!isPatientContext()) {
  <header class="fixed top-0 left-0 w-full h-16 bg-white border-b border-slate-200 z-60 shadow-sm">
    <div class="px-6 h-full flex justify-between items-center">
      <div class="flex items-center gap-1.5 h-16 select-none">
        <div class="flex items-center justify-center w-12 h-full">
          <img
            src="logo-header.svg"
            alt="Logo Omnisalud"
            class="h-16 w-auto object-cover mix-blend-multiply"
          />
        </div>

        <span class="text-2xl font-black text-slate-900 tracking-tighter uppercase italic leading-none flex items-center pt-3px">
          Omni<span class="text-blue-600">salud</span>
        </span>
      </div>

      <div class="flex items-center gap-6">
        <button class="relative p-2 text-slate-400 hover:text-slate-900">
          <i class="fa-solid fa-bell text-xl"></i>
          <span class="absolute top-2 right-2 w-2 h-2 bg-rose-500 rounded-full border-2 border-white"></span>
        </button>
        <div class="flex items-center gap-3 pl-6 border-l border-slate-100">
  <div class="text-right hidden md:block">
    <!-- Usamos el operador de navegación segura para evitar errores si el user es null -->
    <p class="text-[11px] font-black text-slate-800 uppercase leading-none">
      {{ user?.fullName || 'Cargando...' }}
    </p>
    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">
      Sede Chillán
    </p>
  </div>

  <!-- Avatar Dinámico -->
  <div class="w-10 h-10 rounded-2xl bg-indigo-50 border border-indigo-100 flex items-center justify-center shadow-sm transition-all hover:bg-indigo-100 cursor-pointer">
    <span class="text-xs font-bold text-indigo-600 tracking-tighter">
      {{ initials }}
    </span>
  </div>
</div>

      </div>
    </div>
  </header>
}

  <div class="flex pt-16" [class.pt-16]="!isPatientContext()"
  [class.pt-0]="isPatientContext()">
    @if (!isPatientContext()) {
    <aside class="fixed left-0 top-16 h-[calc(100vh-4rem)] w-64 bg-white border-r border-slate-200 overflow-y-auto shadow-sm z-50">
      <div class="px-6 py-4 border-b border-slate-50 mb-2">
        <p class="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em]">Menú Clínico</p>
      </div>

      <nav class="p-4 space-y-1">
        <a routerLink="/app/agenda"
       routerLinkActive="bg-slate-900 text-white shadow-lg shadow-slate-200"
       class="flex items-center gap-3 px-4 py-3 text-[11px] font-black uppercase tracking-widest text-slate-600 hover:bg-blue-600 hover:text-white rounded-2xl transition-all">
      <i class="fa-solid fa-calendar-days text-xs"></i>
      Agenda
    </a>

    <a routerLink="/pacientes"
       routerLinkActive="bg-slate-900 text-white shadow-lg shadow-slate-200"
       class="flex items-center gap-3 px-4 py-3 text-[11px] font-black uppercase tracking-widest text-slate-600 hover:bg-blue-600 hover:text-white rounded-2xl transition-all">
      <i class="fa-solid fa-users text-xs"></i>
      Pacientes
    </a>

    <a routerLink="/historial"
       routerLinkActive="bg-slate-900 text-white shadow-lg shadow-slate-200"
       class="flex items-center gap-3 px-4 py-3 text-[11px] font-black uppercase tracking-widest text-slate-600 hover:bg-blue-600 hover:text-white rounded-2xl transition-all">
      <i class="fa-solid fa-file-medical text-xs"></i>
      Historiales
    </a>

    <a routerLink="/presupuestos"
     routerLinkActive="bg-blue-600 text-white shadow-lg shadow-blue-100"
     class="flex items-center gap-3 px-4 py-3 text-[11px] font-black uppercase tracking-widest text-slate-600 hover:bg-blue-600 hover:text-white rounded-2xl transition-all">
    <i class="fa-solid fa-file-invoice-dollar text-xs"></i>
    Presupuestos
  </a>

  <a routerLink="/prestaciones"
     routerLinkActive="bg-blue-600 text-white shadow-lg shadow-blue-100"
     class="flex items-center gap-3 px-4 py-3 text-[11px] font-black uppercase tracking-widest text-slate-600 hover:bg-blue-600 hover:text-white rounded-2xl transition-all">
    <i class="fa-solid fa-file-invoice-dollar text-xs"></i>
    Prestaciones
  </a>

  </nav>

  <div class="absolute bottom-4 w-full px-4">
    <button  (click)="authService.logout()" class="w-full flex items-center gap-3 px-4 py-3 text-[10px] font-black uppercase text-rose-500 hover:bg-rose-50 rounded-2xl transition-all">
      <i class="fa-solid fa-right-from-bracket"></i>
      Cerrar Sesión
    </button>
  </div>

    </aside>
    }

    <main  [class.ml-64]="!isPatientContext()" [class.ml-0]="isPatientContext()" class="flex-1 p-8 ml-64 w-[calc(100%-16rem)]">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
