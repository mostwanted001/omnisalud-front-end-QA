<div class="p-8 space-y-6">
  <!-- HEADER CON SWITCHER -->
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-black text-slate-900 uppercase italic tracking-tighter">
        Control de Citas <span class="text-blue-600">.</span>
      </h1>
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">Gestión Clínica Sede Chillán</p>
    </div>

    <!-- SWITCHER DE VISTA -->
    <div class="bg-slate-100 p-1 rounded-2xl flex gap-1 border border-slate-200">
      <button (click)="setMode('dia')"
              [class.bg-white]="isModeActive('dia')"
              [class.shadow-sm]="isModeActive('dia')"
              class="px-6 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">
        Díaria
      </button>
      <button (click)="setMode('semana')"
              [class.bg-white]="isModeActive('semana')"
              [class.shadow-sm]="isModeActive('semana')"
              class="px-6 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">
        Semanal
      </button>
    </div>
  </div>


  <router-outlet></router-outlet>
</div>
